<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lienzo de Partículas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0b0d17;
    height: 100%;
    width: 100%;
    font-family: system-ui, sans-serif;
    cursor: crosshair;
  }
  canvas {
    display: block;
  }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #fff;
    background: rgba(20, 20, 35, 0.6);
    backdrop-filter: blur(6px);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    user-select: none;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  #ui h1 {
    font-size: 15px;
    margin: 0 0 8px 0;
    font-weight: 600;
  }
  #ui label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }
  #ui select, #ui input[type=range] {
    accent-color: #7c6cff;
  }
  .swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 4px;
    margin-right: 4px;
    vertical-align: middle;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.active {
    border-color: #fff;
  }
  #clearBtn {
    margin-top: 8px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  #clearBtn:hover {
    background: rgba(255,255,255,0.2);
  }
  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    user-select: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>✨ Lienzo de Partículas</h1>
  <label>Modo:
    <select id="mode">
      <option value="burst">Explosión</option>
      <option value="trail">Estela</option>
      <option value="fireworks">Fuegos artificiales</option>
    </select>
  </label>
  <label>Gravedad:
    <input type="range" id="gravity" min="-0.3" max="0.3" step="0.01" value="0.08">
  </label>
  <label>Paleta:
    <span id="palettes"></span>
  </label>
  <button id="clearBtn">Limpiar</button>
</div>
<div id="hint">Haz clic, arrastra o toca la pantalla — suelta el mouse en "Fuegos artificiales" para lanzar</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const palettes = {
  neon: ['#ff5cf1', '#5cf1ff', '#c8ff5c', '#ff9d5c', '#8a5cff'],
  fire: ['#ff3d00', '#ff8c00', '#ffd400', '#ff5722', '#ffab00'],
  ocean: ['#00e5ff', '#2979ff', '#00bfa5', '#18ffff', '#536dfe'],
  pastel: ['#ffb3ba', '#baffc9', '#bae1ff', '#ffffba', '#e0bbff']
};
let currentPalette = 'neon';

const palettesEl = document.getElementById('palettes');
Object.keys(palettes).forEach((name, i) => {
  const sw = document.createElement('span');
  sw.className = 'swatch' + (name === currentPalette ? ' active' : '');
  sw.style.background = `linear-gradient(135deg, ${palettes[name][0]}, ${palettes[name][2]})`;
  sw.dataset.name = name;
  sw.title = name;
  sw.addEventListener('click', () => {
    currentPalette = name;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
  });
  palettesEl.appendChild(sw);
});

function randColor() {
  const arr = palettes[currentPalette];
  return arr[Math.floor(Math.random() * arr.length)];
}

let gravity = 0.08;
document.getElementById('gravity').addEventListener('input', e => {
  gravity = parseFloat(e.target.value);
});

let mode = 'burst';
document.getElementById('mode').addEventListener('change', e => {
  mode = e.target.value;
});

document.getElementById('clearBtn').addEventListener('click', () => {
  particles.length = 0;
});

class Particle {
  constructor(x, y, opts = {}) {
    this.x = x;
    this.y = y;
    const angle = opts.angle ?? Math.random() * Math.PI * 2;
    const speed = opts.speed ?? Math.random() * 6 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size = opts.size ?? Math.random() * 4 + 2;
    this.color = opts.color ?? randColor();
    this.life = 1;
    this.decay = opts.decay ?? (Math.random() * 0.015 + 0.008);
    this.trail = opts.trail ?? false;
    this.spark = opts.spark ?? false;
  }
  update() {
    this.vy += gravity;
    this.vx *= 0.99;
    this.vy *= 0.99;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    ctx.globalAlpha = Math.max(this.life, 0);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = this.spark ? 12 : 6;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(this.size * this.life, 0), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

let particles = [];
let rockets = [];

function burst(x, y, count = 24) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y));
  }
}

function trailAt(x, y) {
  particles.push(new Particle(x, y, {
    speed: Math.random() * 1.5,
    size: Math.random() * 3 + 1.5,
    decay: Math.random() * 0.02 + 0.015
  }));
}

class Rocket {
  constructor(x) {
    this.x = x;
    this.y = H;
    this.targetY = Math.random() * H * 0.35 + H * 0.15;
    this.vy = -(Math.random() * 4 + 9);
    this.color = randColor();
  }
  update() {
    this.y += this.vy;
    particles.push(new Particle(this.x, this.y, {
      speed: 0.3,
      size: 1.5,
      decay: 0.05,
      color: this.color
    }));
  }
  done() {
    return this.y <= this.targetY;
  }
}

let mouseDown = false;
let lastPos = null;

function getPos(e) {
  if (e.touches && e.touches.length) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

function handleDown(e) {
  mouseDown = true;
  const pos = getPos(e);
  lastPos = pos;
  if (mode === 'burst') {
    burst(pos.x, pos.y);
  } else if (mode === 'fireworks') {
    rockets.push(new Rocket(pos.x));
  } else if (mode === 'trail') {
    trailAt(pos.x, pos.y);
  }
}

function handleMove(e) {
  if (!mouseDown) return;
  const pos = getPos(e);
  if (mode === 'trail') {
    trailAt(pos.x, pos.y);
  } else if (mode === 'burst') {
    if (!lastPos || Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y) > 20) {
      burst(pos.x, pos.y, 8);
      lastPos = pos;
    }
  }
}

function handleUp() {
  mouseDown = false;
  lastPos = null;
}

canvas.addEventListener('mousedown', handleDown);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleUp);
canvas.addEventListener('touchstart', e => { handleDown(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', e => { handleMove(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', handleUp);

function animate() {
  ctx.fillStyle = 'rgba(11, 13, 23, 0.18)';
  ctx.fillRect(0, 0, W, H);

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.update();
    if (r.done()) {
      burst(r.x, r.y, 40);
      rockets.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();
    if (p.life <= 0 || p.y > H + 50) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

// pequeña explosión de bienvenida
setTimeout(() => burst(W / 2, H / 2, 40), 300);
</script>
</body>
</html>
