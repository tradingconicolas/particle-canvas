<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Mi Nutrición</title>
<meta name="description" content="Registro personal de alimentación diaria">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutrición">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<style>
  :root {
    --bg: #0a0a0c;
    --card: #17171b;
    --card-2: #1f1f24;
    --border: #2a2a30;
    --gold: #f5c542;
    --gold-dim: #a88a2e;
    --text: #f5f5f7;
    --text-dim: #97979d;
    --text-faint: #616166;
    --danger: #ff6b6b;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  body.no-scroll { overflow: hidden; height: 100%; }

  #app {
    max-width: 520px;
    margin: 0 auto;
    padding-bottom: calc(48px + var(--safe-bottom));
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(18px + var(--safe-top)) 20px 8px;
  }

  .topbar h1 {
    font-size: 30px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.5px;
  }

  .date-sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 2px;
    text-transform: capitalize;
  }

  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:active { background: var(--card-2); }
  .icon-btn.hidden { visibility: hidden; }

  main { padding: 10px 16px 20px; }

  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 20px 20px;
    margin-bottom: 18px;
  }

  .summary-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }

  .summary-label {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .kcal-display {
    text-align: center;
    margin: 10px 0 14px;
  }
  .kcal-display .n1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1px;
  }
  .kcal-display .sep {
    font-size: 26px;
    color: var(--text-faint);
    margin: 0 4px;
  }
  .kcal-display .n2 {
    font-size: 26px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .kcal-display .unit {
    display: block;
    font-size: 13px;
    color: var(--text-faint);
    margin-top: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .progress-bar {
    width: 100%;
    background: var(--card-2);
    border-radius: 20px;
    overflow: hidden;
  }
  .progress-bar.big { height: 12px; margin-bottom: 20px; }
  .progress-bar.small { height: 7px; margin-top: 8px; }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 20px;
    transition: width 0.35s ease;
  }
  .progress-fill.over {
    background: linear-gradient(90deg, #e05252, var(--danger));
  }

  .macros-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .macro-label {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .macro-value {
    font-size: 15px;
    font-weight: 700;
    margin-top: 3px;
  }
  .macro-value .goal { color: var(--text-faint); font-weight: 500; }

  .meal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 16px 14px;
    margin-bottom: 14px;
  }

  .meal-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .meal-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  .meal-kcal {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 600;
  }

  .meal-items { margin: 4px 0 10px; }

  .food-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .food-item:last-child { border-bottom: none; }

  .food-item-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }
  .food-item-detail {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 20px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete-btn:active { background: var(--card-2); color: var(--danger); }

  .add-food-btn {
    width: 100%;
    background: var(--card-2);
    border: 1px dashed var(--border);
    color: var(--gold);
    font-size: 15px;
    font-weight: 700;
    padding: 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
  }
  .add-food-btn:active { background: #262629; }

  /* Overlay / Sheet */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    background: var(--bg);
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    padding-bottom: var(--safe-bottom);
  }
  .overlay.open .sheet { transform: translateY(0); }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sheet-header h2 {
    font-size: 17px;
    margin: 0;
    font-weight: 700;
    text-align: center;
    flex: 1;
  }

  .sheet-body {
    padding: 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .search-input, .form-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    outline: none;
  }
  .search-input:focus, .form-input:focus { border-color: var(--gold-dim); }

  .quick-manual-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--gold);
    font-size: 15px;
    font-weight: 700;
    padding: 13px 16px;
    border-radius: var(--radius-md);
    margin-top: 12px;
    cursor: pointer;
  }

  .result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    gap: 10px;
  }
  .result-item:active { background: var(--card-2); }
  .result-name { font-size: 15px; font-weight: 600; }
  .result-detail { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .result-cat {
    font-size: 10.5px;
    color: var(--gold-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
    margin-top: 3px;
  }
  .result-arrow { color: var(--text-faint); font-size: 18px; flex-shrink: 0; }

  .empty-state {
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    padding: 40px 10px;
  }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .qty-food-name {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .qty-food-per100 {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .qty-preview {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 10px;
    margin: 16px 0 6px;
    text-align: center;
  }
  .qty-preview .val { font-size: 17px; font-weight: 800; }
  .qty-preview .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }

  .btn-primary {
    width: 100%;
    background: var(--gold);
    color: #1a1400;
    border: none;
    font-size: 16px;
    font-weight: 800;
    padding: 15px;
    border-radius: var(--radius-md);
    margin-top: 18px;
    cursor: pointer;
  }
  .btn-primary:active { background: var(--gold-dim); }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .choice-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .choice-card:active { background: var(--card-2); }
  .choice-card.selected {
    background: rgba(245, 197, 66, 0.1);
    border-color: var(--gold);
  }
  .choice-icon { font-size: 22px; width: 26px; text-align: center; flex-shrink: 0; }
  .choice-title { font-size: 15px; font-weight: 700; }
  .choice-desc { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .choice-check {
    margin-left: auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: transparent;
  }
  .choice-card.selected .choice-check {
    border-color: var(--gold);
    background: var(--gold);
    color: #1a1400;
  }

  .segmented {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 4px;
    margin-bottom: 14px;
  }
  .segmented button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 700;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .segmented button.selected {
    background: var(--gold);
    color: #1a1400;
  }

  .calc-intro {
    text-align: center;
    margin: 4px 0 20px;
  }
  .calc-intro .emoji { font-size: 38px; }
  .calc-intro h3 { font-size: 19px; margin: 10px 0 4px; }
  .calc-intro p { font-size: 13.5px; color: var(--text-dim); margin: 0; }

  .result-hero {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 18px;
    margin: 10px 0 18px;
  }
  .result-hero .kcal-big { font-size: 40px; font-weight: 800; }
  .result-hero .kcal-big .u { font-size: 16px; color: var(--text-dim); font-weight: 600; margin-left: 4px; }
  .result-disclaimer {
    font-size: 11.5px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
  }

  ::selection { background: var(--gold-dim); color: #000; }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div>
      <h1>Hoy</h1>
      <div class="date-sub" id="dateLabel"></div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Ajustes">⚙️</button>
  </header>

  <main>
    <section class="summary-card">
      <div class="summary-top">
        <span class="summary-label">Calorías</span>
      </div>
      <div class="kcal-display">
        <span class="n1" id="kcalConsumed">0</span><span class="sep">/</span><span class="n2" id="kcalGoal">2000</span>
        <span class="unit">kcal</span>
      </div>
      <div class="progress-bar big"><div class="progress-fill" id="kcalFill"></div></div>

      <div class="macros-row">
        <div class="macro">
          <div class="macro-label">Proteína</div>
          <div class="macro-value"><span id="proteinConsumed">0</span><span class="goal"> / <span id="proteinGoal">150</span>g</span></div>
          <div class="progress-bar small"><div class="progress-fill" id="proteinFill"></div></div>
        </div>
        <div class="macro">
          <div class="macro-label">Carbos</div>
          <div class="macro-value"><span id="carbsConsumed">0</span><span class="goal"> / <span id="carbsGoal">200</span>g</span></div>
          <div class="progress-bar small"><div class="progress-fill" id="carbsFill"></div></div>
        </div>
        <div class="macro">
          <div class="macro-label">Grasas</div>
          <div class="macro-value"><span id="fatConsumed">0</span><span class="goal"> / <span id="fatGoal">65</span>g</span></div>
          <div class="progress-bar small"><div class="progress-fill" id="fatFill"></div></div>
        </div>
      </div>
    </section>

    <section id="mealsContainer"></section>
  </main>
</div>

<!-- Sheet: agregar alimento (búsqueda / cantidad / manual) -->
<div class="overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <button class="icon-btn hidden" id="sheetBack" aria-label="Atrás">←</button>
      <h2 id="sheetTitle">Agregar alimento</h2>
      <button class="icon-btn" id="sheetClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- Sheet: ajustes -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <div style="width:44px"></div>
      <h2>Mis metas diarias</h2>
      <button class="icon-btn" id="settingsClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="sheet-body">
      <label style="display:block;font-size:13px;color:var(--text-dim);font-weight:600;margin-bottom:8px;">Estructura de comidas</label>
      <div id="mealStructureWrap"></div>
      <button class="quick-manual-btn" id="openCalcBtn" style="justify-content:center;margin-top:18px;">🧮 &nbsp; Calcular mis metas automáticamente</button>
      <div style="text-align:center;color:var(--text-faint);font-size:12px;margin:16px 0;">o ingresa tus metas manualmente</div>
      <div class="field">
        <label>Calorías (kcal)</label>
        <input class="form-input" type="number" inputmode="numeric" id="goalKcal" min="0">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Proteína (g)</label>
          <input class="form-input" type="number" inputmode="numeric" id="goalProtein" min="0">
        </div>
        <div class="field">
          <label>Carbohidratos (g)</label>
          <input class="form-input" type="number" inputmode="numeric" id="goalCarbs" min="0">
        </div>
      </div>
      <div class="field">
        <label>Grasas (g)</label>
        <input class="form-input" type="number" inputmode="numeric" id="goalFat" min="0">
      </div>
      <button class="btn-primary" id="saveSettingsBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Sheet: calculadora de metas (estilo cuestionario Fitia) -->
<div class="overlay" id="calcOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <button class="icon-btn hidden" id="calcBack" aria-label="Atrás">←</button>
      <h2 id="calcTitle">Calcular metas</h2>
      <button class="icon-btn" id="calcClose" aria-label="Cerrar">✕</button>
    </div>
    <div style="padding: 10px 16px 0;">
      <div class="progress-bar small"><div class="progress-fill" id="calcProgressFill" style="width:16%"></div></div>
    </div>
    <div class="sheet-body" id="calcBody"></div>
  </div>
</div>

// ---------- Config / storage ----------
const STORAGE_SETTINGS = 'ft.settings.v1';
const STORAGE_DIARY = 'ft.diary.v1';
const STORAGE_PROFILE = 'ft.profile.v1';
const STORAGE_MEAL_STRUCTURE = 'ft.mealStructure.v1';
const DEFAULT_GOALS = { kcal: 2000, protein: 150, carbs: 200, fat: 65 };

// Estructuras de comidas disponibles. OMAD (One Meal A Day) usa una sola
// sección; tus metas de calorías/macros se aplican igual sobre esa comida.
const MEAL_STRUCTURES = {
  classic: [
    { key: 'desayuno', label: 'Desayuno' },
    { key: 'almuerzo', label: 'Almuerzo' },
    { key: 'cena', label: 'Cena' },
    { key: 'snacks', label: 'Snacks' },
  ],
  omad: [
    { key: 'omad', label: 'OMAD · Tu única comida' },
  ],
};
const ALL_MEAL_LABELS = { desayuno: 'Desayuno', almuerzo: 'Almuerzo', cena: 'Cena', snacks: 'Snacks', omad: 'OMAD' };
const ALL_MEAL_KEYS = Object.keys(ALL_MEAL_LABELS);

function loadMealStructure() {
  const v = localStorage.getItem(STORAGE_MEAL_STRUCTURE);
  return v === 'omad' ? 'omad' : 'classic';
}
function saveMealStructure(v) { localStorage.setItem(STORAGE_MEAL_STRUCTURE, v); }
function getCurrentMeals() { return MEAL_STRUCTURES[mealStructure]; }

function todayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_SETTINGS);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveSettings(goals) {
  localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(goals));
}

function saveProfile(profile) {
  localStorage.setItem(STORAGE_PROFILE, JSON.stringify(profile));
}

function loadDiary() {
  try {
    const raw = localStorage.getItem(STORAGE_DIARY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveDiary(diary) {
  localStorage.setItem(STORAGE_DIARY, JSON.stringify(diary));
}

function ensureMealKeys(entries) {
  ALL_MEAL_KEYS.forEach(k => { if (!entries[k]) entries[k] = []; });
  return entries;
}

function getTodayEntries() {
  const diary = loadDiary();
  const key = todayKey();
  if (!diary[key]) diary[key] = {};
  ensureMealKeys(diary[key]);
  saveDiary(diary);
  return diary[key];
}

function makeId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function normalize(str) {
  return str.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function round1(n) { return Math.round(n * 10) / 10; }

// ---------- State ----------
let goals = loadSettings() || { ...DEFAULT_GOALS };
let mealStructure = loadMealStructure();
let currentSheetMeal = null;
let currentSelectedFood = null;

// ---------- Render: header date ----------
function renderDate() {
  const d = new Date();
  const label = d.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('dateLabel').textContent = label;
}

// ---------- Render: summary ----------
function renderSummary() {
  const entries = getTodayEntries();
  let kcal = 0, protein = 0, carbs = 0, fat = 0;
  ALL_MEAL_KEYS.forEach(k => {
    entries[k].forEach(item => {
      kcal += item.kcal; protein += item.protein; carbs += item.carbs; fat += item.fat;
    });
  });
  kcal = Math.round(kcal); protein = round1(protein); carbs = round1(carbs); fat = round1(fat);

  document.getElementById('kcalConsumed').textContent = kcal;
  document.getElementById('kcalGoal').textContent = goals.kcal;
  document.getElementById('proteinConsumed').textContent = protein;
  document.getElementById('proteinGoal').textContent = goals.protein;
  document.getElementById('carbsConsumed').textContent = carbs;
  document.getElementById('carbsGoal').textContent = goals.carbs;
  document.getElementById('fatConsumed').textContent = fat;
  document.getElementById('fatGoal').textContent = goals.fat;

  setFill('kcalFill', kcal, goals.kcal);
  setFill('proteinFill', protein, goals.protein);
  setFill('carbsFill', carbs, goals.carbs);
  setFill('fatFill', fat, goals.fat);
}

function setFill(id, value, goal) {
  const el = document.getElementById(id);
  const pct = goal > 0 ? (value / goal) * 100 : 0;
  el.style.width = Math.min(pct, 100) + '%';
  el.classList.toggle('over', pct > 100);
}

// ---------- Render: meals ----------
function renderMealCard(key, label, items) {
  const subtotal = Math.round(items.reduce((sum, i) => sum + i.kcal, 0));

  const card = document.createElement('div');
  card.className = 'meal-card';

  const header = document.createElement('div');
  header.className = 'meal-header';
  header.innerHTML = `<h3>${label}</h3><span class="meal-kcal">${subtotal} kcal</span>`;
  card.appendChild(header);

  const itemsWrap = document.createElement('div');
  itemsWrap.className = 'meal-items';
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'food-item';
    row.innerHTML = `
      <div>
        <div class="food-item-name">${escapeHtml(item.name)}</div>
        <div class="food-item-detail">${item.grams ? item.grams + ' g · ' : ''}${Math.round(item.kcal)} kcal · P${round1(item.protein)} C${round1(item.carbs)} G${round1(item.fat)}</div>
      </div>
      <button class="delete-btn" data-meal="${key}" data-id="${item.id}" aria-label="Eliminar">✕</button>
    `;
    itemsWrap.appendChild(row);
  });
  card.appendChild(itemsWrap);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-food-btn';
  addBtn.textContent = '+ Agregar alimento';
  addBtn.dataset.meal = key;
  card.appendChild(addBtn);

  return card;
}

function renderMeals() {
  const entries = getTodayEntries();
  const container = document.getElementById('mealsContainer');
  container.innerHTML = '';

  const currentMeals = getCurrentMeals();
  currentMeals.forEach(meal => {
    container.appendChild(renderMealCard(meal.key, meal.label, entries[meal.key]));
  });

  // Si quedaron ítems registrados bajo otra estructura (ej. cambiaste de
  // Clásico a OMAD a mitad del día), se siguen mostrando aquí para que el
  // total de calorías nunca quede "oculto".
  const currentKeys = currentMeals.map(m => m.key);
  ALL_MEAL_KEYS.filter(k => !currentKeys.includes(k) && entries[k].length > 0).forEach(k => {
    container.appendChild(renderMealCard(k, ALL_MEAL_LABELS[k], entries[k]));
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAll() {
  renderDate();
  renderSummary();
  renderMeals();
}

// ---------- Delete item ----------
document.getElementById('mealsContainer').addEventListener('click', (e) => {
  const delBtn = e.target.closest('.delete-btn');
  if (delBtn) {
    const diary = loadDiary();
    const key = todayKey();
    const mealKey = delBtn.dataset.meal;
    const id = delBtn.dataset.id;
    diary[key][mealKey] = diary[key][mealKey].filter(i => i.id !== id);
    saveDiary(diary);
    renderAll();
    return;
  }
  const addBtn = e.target.closest('.add-food-btn');
  if (addBtn) {
    openSheet(addBtn.dataset.meal);
  }
});

// ---------- Sheet: agregar alimento ----------
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetBody = document.getElementById('sheetBody');
const sheetTitle = document.getElementById('sheetTitle');
const sheetBack = document.getElementById('sheetBack');

function openSheet(mealKey) {
  currentSheetMeal = mealKey;
  sheetTitle.textContent = `Agregar a ${ALL_MEAL_LABELS[mealKey]}`;
  sheetBack.classList.add('hidden');
  renderSearchView();
  showOverlay(sheetOverlay);
}

function closeSheet() {
  hideOverlay(sheetOverlay);
  currentSheetMeal = null;
  currentSelectedFood = null;
}

document.getElementById('sheetClose').addEventListener('click', closeSheet);
sheetOverlay.addEventListener('click', (e) => { if (e.target === sheetOverlay) closeSheet(); });

function showOverlay(el) {
  document.body.classList.add('no-scroll');
  el.classList.add('open');
}
function hideOverlay(el) {
  document.body.classList.remove('no-scroll');
  el.classList.remove('open');
}

// ---- Search view ----
function renderSearchView() {
  sheetBack.classList.add('hidden');
  sheetTitle.textContent = `Agregar a ${ALL_MEAL_LABELS[currentSheetMeal]}`;
  sheetBody.innerHTML = `
    <input type="text" class="search-input" id="foodSearchInput" placeholder="Buscar alimentos..." autocomplete="off">
    <button class="quick-manual-btn" id="manualEntryBtn">✏️ &nbsp; Ingreso manual (calorías y macros)</button>
    <div id="searchResults"></div>
  `;

  const input = document.getElementById('foodSearchInput');
  const resultsEl = document.getElementById('searchResults');

  function doSearch() {
    const q = normalize(input.value.trim());
    let list = FOODS;
    if (q.length > 0) {
      list = FOODS.filter(f => normalize(f.name).includes(q));
    }
    renderResults(list, resultsEl, q.length > 0);
  }

  input.addEventListener('input', doSearch);
  document.getElementById('manualEntryBtn').addEventListener('click', renderManualView);
  doSearch();
  setTimeout(() => input.focus(), 250);
}

function renderResults(list, container, isFiltered) {
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">No se encontró ese alimento.<br>Usa "Ingreso manual" para agregarlo.</div>`;
    return;
  }
  const toShow = isFiltered ? list : list;
  toShow.forEach(food => {
    const row = document.createElement('div');
    row.className = 'result-item';
    row.innerHTML = `
      <div>
        <div class="result-name">${escapeHtml(food.name)}</div>
        <div class="result-detail">${food.kcal} kcal · P${food.protein} C${food.carbs} G${food.fat} <span style="color:var(--text-faint)">/100g</span></div>
        <div class="result-cat">${escapeHtml(food.cat)}</div>
      </div>
      <span class="result-arrow">›</span>
    `;
    row.addEventListener('click', () => {
      currentSelectedFood = food;
      renderQuantityView();
    });
    container.appendChild(row);
  });
}

// ---- Quantity view ----
function renderQuantityView() {
  const food = currentSelectedFood;
  sheetTitle.textContent = 'Cantidad';
  sheetBack.classList.remove('hidden');
  sheetBack.onclick = renderSearchView;

  sheetBody.innerHTML = `
    <div class="qty-food-name">${escapeHtml(food.name)}</div>
    <div class="qty-food-per100">${food.kcal} kcal · P${food.protein}g C${food.carbs}g G${food.fat}g (por 100g)</div>
    <div class="field">
      <label>Cantidad (gramos)</label>
      <input type="number" class="form-input" id="qtyInput" inputmode="decimal" value="100" min="0" step="1">
    </div>
    <div class="qty-preview">
      <div><div class="val" id="pvKcal">0</div><div class="lbl">Kcal</div></div>
      <div><div class="val" id="pvProtein">0</div><div class="lbl">Prot.</div></div>
      <div><div class="val" id="pvCarbs">0</div><div class="lbl">Carbs</div></div>
      <div><div class="val" id="pvFat">0</div><div class="lbl">Grasa</div></div>
    </div>
    <button class="btn-primary" id="confirmQtyBtn">Agregar</button>
  `;

  const qtyInput = document.getElementById('qtyInput');
  function updatePreview() {
    const grams = parseFloat(qtyInput.value) || 0;
    const factor = grams / 100;
    document.getElementById('pvKcal').textContent = Math.round(food.kcal * factor);
    document.getElementById('pvProtein').textContent = round1(food.protein * factor);
    document.getElementById('pvCarbs').textContent = round1(food.carbs * factor);
    document.getElementById('pvFat').textContent = round1(food.fat * factor);
  }
  qtyInput.addEventListener('input', updatePreview);
  updatePreview();
  setTimeout(() => { qtyInput.focus(); qtyInput.select(); }, 250);

  document.getElementById('confirmQtyBtn').addEventListener('click', () => {
    const grams = parseFloat(qtyInput.value) || 0;
    const factor = grams / 100;
    addEntry({
      id: makeId(),
      name: food.name,
      grams: grams,
      kcal: food.kcal * factor,
      protein: food.protein * factor,
      carbs: food.carbs * factor,
      fat: food.fat * factor,
    });
  });
}

// ---- Manual entry view ----
function renderManualView() {
  sheetTitle.textContent = 'Ingreso manual';
  sheetBack.classList.remove('hidden');
  sheetBack.onclick = renderSearchView;

  sheetBody.innerHTML = `
    <div class="field">
      <label>Nombre del alimento</label>
      <input type="text" class="form-input" id="manName" placeholder="Ej. Ensalada de la esquina" autocomplete="off">
    </div>
    <div class="field">
      <label>Cantidad (g, opcional)</label>
      <input type="number" class="form-input" id="manGrams" inputmode="decimal" placeholder="Ej. 250" min="0">
    </div>
    <div class="field">
      <label>Calorías (kcal)</label>
      <input type="number" class="form-input" id="manKcal" inputmode="decimal" placeholder="0" min="0">
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Proteína (g)</label>
        <input type="number" class="form-input" id="manProtein" inputmode="decimal" placeholder="0" min="0">
      </div>
      <div class="field">
        <label>Carbohidratos (g)</label>
        <input type="number" class="form-input" id="manCarbs" inputmode="decimal" placeholder="0" min="0">
      </div>
    </div>
    <div class="field">
      <label>Grasas (g)</label>
      <input type="number" class="form-input" id="manFat" inputmode="decimal" placeholder="0" min="0">
    </div>
    <button class="btn-primary" id="confirmManualBtn">Agregar</button>
  `;

  setTimeout(() => document.getElementById('manName').focus(), 250);

  document.getElementById('confirmManualBtn').addEventListener('click', () => {
    const name = document.getElementById('manName').value.trim();
    if (!name) { document.getElementById('manName').focus(); return; }
    const grams = parseFloat(document.getElementById('manGrams').value) || null;
    const kcal = parseFloat(document.getElementById('manKcal').value) || 0;
    const protein = parseFloat(document.getElementById('manProtein').value) || 0;
    const carbs = parseFloat(document.getElementById('manCarbs').value) || 0;
    const fat = parseFloat(document.getElementById('manFat').value) || 0;

    addEntry({ id: makeId(), name, grams, kcal, protein, carbs, fat });
  });
}

function addEntry(entry) {
  const diary = loadDiary();
  const key = todayKey();
  if (!diary[key]) diary[key] = {};
  ensureMealKeys(diary[key]);
  diary[key][currentSheetMeal].push(entry);
  saveDiary(diary);
  closeSheet();
  renderAll();
}

const settingsOverlay = document.getElementById('settingsOverlay');

document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  const kcal = parseFloat(document.getElementById('goalKcal').value) || DEFAULT_GOALS.kcal;
  const protein = parseFloat(document.getElementById('goalProtein').value) || DEFAULT_GOALS.protein;
  const carbs = parseFloat(document.getElementById('goalCarbs').value) || DEFAULT_GOALS.carbs;

  goals = { kcal, protein, carbs, fat };

  closeSettings();

});

// ---------- Calculadora de metas (cuestionario tipo Fitia) ----------
// Metodología: Mifflin-St Jeor (BMR) + factores de actividad del Compendium of
// Physical Activities (Ainsworth) + proteína por kg según entrenamiento de
// fuerza (Helms/Morton/Phillips) + grasas ~25% + carbohidratos = resto.
const calcOverlay = document.getElementById('calcOverlay');
const calcBody = document.getElementById('calcBody');
const calcTitle = document.getElementById('calcTitle');
const calcBack = document.getElementById('calcBack');
const calcProgressFill = document.getElementById('calcProgressFill');
let calcState = {};

const ACTIVITY_LEVELS = [
  { key: 'sedentario', factor: 1.2, icon: '🚫', title: 'No hago ejercicio', desc: 'Poco o nada de actividad física' },
  { key: 'ligero', factor: 1.375, icon: '🔥', title: '1-2 días por semana', desc: 'Ejercicio ligero' },
  { key: 'moderado', factor: 1.55, icon: '🔥', title: '3-4 días por semana', desc: 'Ejercicio moderado' },
  { key: 'activo', factor: 1.725, icon: '🔥', title: '5-6 días por semana', desc: 'Ejercicio intenso' },
  { key: 'muyactivo', factor: 1.9, icon: '🔥', title: 'Diario', desc: 'Ejercicio muy intenso o trabajo físico' },
];

function openCalcWizard() {
  calcState = {};
  renderCalcObjetivo();
  showOverlay(calcOverlay);
}
function closeCalcWizard() { hideOverlay(calcOverlay); }

function setCalcStep(step, total, title, showBack) {
  calcTitle.textContent = title;
  calcProgressFill.style.width = Math.round((step / total) * 100) + '%';
  calcBack.classList.toggle('hidden', !showBack);
}

document.getElementById('openCalcBtn').addEventListener('click', () => {
  hideOverlay(settingsOverlay);
  openCalcWizard();
});
calcBack.addEventListener('click', () => { if (calcBack.onclick) calcBack.onclick(); });
document.getElementById('calcClose').addEventListener('click', () => {
  hideOverlay(calcOverlay);
  if (!loadSettings()) openSettings();
});
calcOverlay.addEventListener('click', (e) => {
  if (e.target === calcOverlay && loadSettings()) hideOverlay(calcOverlay);
});

function renderChoiceCards(options, selectedKey, onPick) {
  const wrap = document.createElement('div');
  options.forEach(opt => {
    const card = document.createElement('div');
    card.className = 'choice-card' + (opt.key === selectedKey ? ' selected' : '');
    card.innerHTML = `
      <div class="choice-icon">${opt.icon}</div>
      <div>
        <div class="choice-title">${opt.title}</div>
        ${opt.desc ? `<div class="choice-desc">${opt.desc}</div>` : ''}
      </div>
      <div class="choice-check">✓</div>
    `;
    card.addEventListener('click', () => onPick(opt));
    wrap.appendChild(card);
  });
  return wrap;
}

// ---- Paso 1: Objetivo ----
function renderCalcObjetivo() {
  setCalcStep(1, 6, '¿Cuál es tu objetivo?', false);
  calcBody.innerHTML = '';
  const options = [
    { key: 'perder', icon: '🔥', title: 'Perder grasa', desc: 'Reduce calorías conservando músculo' },
    { key: 'ganar', icon: '💪', title: 'Ganar músculo', desc: 'Aumenta peso y fuerza' },
    { key: 'mantener', icon: '❤️', title: 'Mantener peso', desc: 'Mantén tu peso estable' },
  ];
  calcBody.appendChild(renderChoiceCards(options, calcState.objetivo, (opt) => {
    calcState.objetivo = opt.key;
    renderCalcDatos();
  }));
}

// ---- Paso 2: Sobre ti (sexo, edad, altura, peso) ----
function renderCalcDatos() {
  setCalcStep(2, 6, 'Sobre ti', true);
  calcBack.onclick = renderCalcObjetivo;
  calcBody.innerHTML = `
    <div class="segmented" id="sexoSeg">
      <button type="button" data-val="hombre">Hombre</button>
      <button type="button" data-val="mujer">Mujer</button>
    </div>
    <div class="field">
      <label>Edad (años)</label>
      <input class="form-input" type="number" inputmode="numeric" id="calcEdad" min="14" max="90" value="${calcState.edad || ''}">
    </div>
    <div class="field">
      <label>Altura (cm)</label>
      <input class="form-input" type="number" inputmode="numeric" id="calcAltura" min="120" max="230" value="${calcState.altura || ''}">
    </div>
    <div class="field">
      <label>Peso actual (kg)</label>
      <input class="form-input" type="number" inputmode="decimal" id="calcPeso" min="30" max="300" value="${calcState.peso || ''}">
    </div>
    <button class="btn-primary" id="calcDatosContinuar">Continuar</button>
  `;
  const sexoSeg = document.getElementById('sexoSeg');
  Array.from(sexoSeg.children).forEach(btn => {
    if (btn.dataset.val === calcState.sexo) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      Array.from(sexoSeg.children).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      calcState.sexo = btn.dataset.val;
    });
  });
  document.getElementById('calcDatosContinuar').addEventListener('click', () => {
    const edad = parseFloat(document.getElementById('calcEdad').value);
    const altura = parseFloat(document.getElementById('calcAltura').value);
    const peso = parseFloat(document.getElementById('calcPeso').value);
    if (!calcState.sexo || !edad || !altura || !peso) return;
    calcState.edad = edad; calcState.altura = altura; calcState.peso = peso;
    renderCalcActividad();
  });
}

// ---- Paso 3: Nivel de actividad ----
function renderCalcActividad() {
  setCalcStep(3, 6, '¿Cuál es tu nivel de actividad?', true);
  calcBack.onclick = renderCalcDatos;
  calcBody.innerHTML = '';
  calcBody.appendChild(renderChoiceCards(ACTIVITY_LEVELS, calcState.actividadKey, (opt) => {
    calcState.actividadKey = opt.key;
    calcState.actividadFactor = opt.factor;
    renderCalcFuerza();
  }));
}

// ---- Paso 4: Entrenamiento de fuerza ----
function renderCalcFuerza() {
  setCalcStep(4, 6, '¿Entrenas con pesas?', true);
  calcBack.onclick = renderCalcActividad;
  calcBody.innerHTML = '<p style="color:var(--text-dim);font-size:13.5px;margin-top:-6px;">Esta información ayuda a calcular cuánta proteína necesitas.</p>';
  const options = [
    { key: true, icon: '🏋️', title: 'Sí', desc: 'Levanto pesas o hago calistenia' },
    { key: false, icon: '🚶', title: 'No', desc: 'No entreno con resistencia' },
  ];
  calcBody.appendChild(renderChoiceCards(options, calcState.fuerza, (opt) => {
    calcState.fuerza = opt.key;
    if (calcState.objetivo === 'mantener') {
      calcState.pesoObjetivo = calcState.peso;
      calcState.velocidad = 'recomendado';
      renderCalcResultado();
    } else {
      renderCalcPesoObjetivo();
    }
  }));
}

// ---- Paso 5: Peso objetivo y velocidad ----
function renderCalcPesoObjetivo() {
  setCalcStep(5, 6, 'Personaliza tu objetivo', true);
  calcBack.onclick = renderCalcFuerza;
  const velOptions = calcState.objetivo === 'perder'
    ? [
        { key: 'lento', title: 'Lento', desc: '~0.25 kg/semana' },
        { key: 'recomendado', title: 'Recomendado', desc: '~0.5 kg/semana' },
        { key: 'rapido', title: 'Rápido', desc: '~0.75 kg/semana' },
      ]
    : [
        { key: 'lento', title: 'Lento', desc: '~0.15 kg/semana' },
        { key: 'recomendado', title: 'Recomendado', desc: '~0.25 kg/semana' },
        { key: 'rapido', title: 'Rápido', desc: '~0.5 kg/semana' },
      ];
  const selectedVel = calcState.velocidad || 'recomendado';

  calcBody.innerHTML = `
    <div class="field">
      <label>Peso objetivo (kg)</label>
      <input class="form-input" type="number" inputmode="decimal" id="calcPesoObjetivo" min="30" max="300" value="${calcState.pesoObjetivo || calcState.peso}">
    </div>
    <label style="display:block;font-size:13px;color:var(--text-dim);font-weight:600;margin:14px 0 8px;">Velocidad</label>
    <div id="velWrap"></div>
    <button class="btn-primary" id="calcPesoContinuar">Continuar</button>
  `;
  const velWrap = document.getElementById('velWrap');
  function paintVel(sel) {
    velWrap.innerHTML = '';
    velOptions.forEach(opt => {
      const card = document.createElement('div');
      card.className = 'choice-card' + (opt.key === sel ? ' selected' : '');
      card.innerHTML = `
        <div>
          <div class="choice-title">${opt.title}</div>
          <div class="choice-desc">${opt.desc}</div>
        </div>
        <div class="choice-check">✓</div>
      `;
      card.addEventListener('click', () => { calcState.velocidad = opt.key; paintVel(opt.key); });
      velWrap.appendChild(card);
    });
  }
  calcState.velocidad = selectedVel;
  paintVel(selectedVel);

  document.getElementById('calcPesoContinuar').addEventListener('click', () => {
    const pesoObjetivo = parseFloat(document.getElementById('calcPesoObjetivo').value);
    if (!pesoObjetivo) return;
    calcState.pesoObjetivo = pesoObjetivo;
    renderCalcResultado();
  });
}

// ---- Cálculo ----
function computeGoals(state) {
  const { sexo, edad, altura, peso, actividadFactor, fuerza, objetivo, velocidad } = state;
  const bmr = sexo === 'hombre'
    ? 10 * peso + 6.25 * altura - 5 * edad + 5
    : 10 * peso + 6.25 * altura - 5 * edad - 161;
  const tdee = bmr * actividadFactor;

  let delta = 0;
  if (objetivo === 'perder') {
    const rate = { lento: 0.25, recomendado: 0.5, rapido: 0.75 }[velocidad];
    delta = -(rate * 7700 / 7);
  } else if (objetivo === 'ganar') {
    const rate = { lento: 0.15, recomendado: 0.25, rapido: 0.5 }[velocidad];
    delta = rate * 7700 / 7;
  }

  const floor = sexo === 'hombre' ? 1500 : 1200;
  const kcal = Math.round(Math.max(tdee + delta, floor));

  const proteinPerKg = fuerza ? 2.0 : 1.4;
  const protein = proteinPerKg * peso;
  const fat = Math.max(0.25 * kcal / 9, 0.6 * peso);
  let carbs = (kcal - protein * 4 - fat * 9) / 4;
  if (carbs < 0) carbs = 0;

  return {
    kcal,
    protein: Math.round(protein),
    carbs: Math.round(carbs),
    fat: Math.round(fat),
  };
}

// ---- Paso 6: Resultado ----
function renderCalcResultado() {
  setCalcStep(6, 6, 'Tus metas diarias', true);
  calcBack.onclick = (calcState.objetivo === 'mantener') ? renderCalcFuerza : renderCalcPesoObjetivo;

  const result = computeGoals(calcState);
  calcBody.innerHTML = `
    <div class="calc-intro" style="margin-top:0;">
      <div class="emoji">✅</div>
      <h3>¡Listo! Estas son tus metas</h3>
      <p>Basadas en tus datos y tu objetivo</p>
    </div>
    <div class="result-hero">
      <div class="kcal-big">${result.kcal}<span class="u">kcal / día</span></div>
      <div class="macros-row" style="margin-top:18px;">
        <div class="macro">
          <div class="macro-label">Proteína</div>
          <div class="macro-value">${result.protein}g</div>
        </div>
        <div class="macro">
          <div class="macro-label">Carbos</div>
          <div class="macro-value">${result.carbs}g</div>
        </div>
        <div class="macro">
          <div class="macro-label">Grasas</div>
          <div class="macro-value">${result.fat}g</div>
        </div>
      </div>
    </div>
    <button class="btn-primary" id="useResultBtn">Usar estas metas</button>
    <div class="result-disclaimer">
      Calculado con la fórmula Mifflin-St Jeor, factores de actividad estándar y
      recomendaciones de proteína basadas en evidencia científica deportiva.
      Es un estimado — ajústalo luego si lo necesitas. Esto no reemplaza el consejo
      de un nutricionista o médico.
    </div>
  `;
  document.getElementById('useResultBtn').addEventListener('click', () => {
    goals = result;
    saveSettings(goals);
    saveProfile(calcState);
    hideOverlay(calcOverlay);
    renderAll();
  });
}

// ---------- Init ----------
renderAll();
if (!loadSettings()) {
  openCalcWizard();
}

// ---------- Service worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
